<!DOCTYPE html>
<html>
<head>
  <title>Ishaaq CV</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
  <div><b>Ishaaq</b></div>
  <div>
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="cv.html">CV</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<div class="container">

  <h1 class="title">Aspiring Cybersecurity Specialist - CV</h1>

  <script id="typing-script">
const text = "Aspiring Cybersecurity Specialist - CV";
let i = 0;

function typeEffect() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeEffect, 50);
  }
}

typeEffect();
</script>

  <p style="text-align:center; opacity:0.8;">
    Learning penetration testing through hands-on labs and practical security practice.
  </p>

  <div style="text-align:center; margin-top:20px;">
    <a href="projects.html" class="btn">View Projects</a>
    <a href="https://github.com/YOURUSERNAME" class="btn">GitHub</a>
  </div>

  <!-- TERMINAL BOX -->
  <div style="background:#000; padding:15px; border-radius:10px; margin-top:30px; font-family:monospace; color:#00ff9c;">

    <p id="terminal"></p>

    <input id="input"
      placeholder="type a command..."
      style="width:100%; background:black; border:none; color:#00ff9c; outline:none; font-family:monospace; margin-top:10px;"
    />

    <p style="margin-top:10px; opacity:0.6; font-size:13px; font-family:monospace;">
      > type a command or type <b>help</b> for all commands
    </p>

  </div>

</div>

<!-- SCRIPT -->
<script>
window.onload = function () {

  const terminal = document.getElementById("terminal");
  const input = document.getElementById("input");

  const lines = [
    "> whoami",
    "ishaaq",
    "",
    "> role",
    "cybersecurity student",
    "",
    "> focus",
    "penetration testing",
    ""
  ];

  let i = 0;
  let j = 0;

  function typeEffect() {
    if (i < lines.length) {
      if (j < lines[i].length) {
        terminal.innerHTML += lines[i][j];
        j++;
        setTimeout(typeEffect, 20);
      } else {
        terminal.innerHTML += "<br>";
        i++;
        j = 0;
        setTimeout(typeEffect, 200);
      }
    }
  }

  typeEffect();

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {

      e.preventDefault();

      const command = input.value.trim();

      terminal.innerHTML += "> " + command + "<br>";

      if (command === "help") {
        terminal.innerHTML += "commands: help, projects, clear, whoami<br>";
      }

      else if (command === "projects") {
        terminal.innerHTML += "opening projects page...<br>";
        setTimeout(() => {
          window.location.href = "projects.html";
        }, 600);
      }

      else if (command === "clear") {
        terminal.innerHTML = "";
      }

      else if (command === "whoami") {
        terminal.innerHTML += "ishaaq - aspiring pentester<br>";
      }

        else if (command === "cv") {
  terminal.innerHTML += "opening CV...<br>";
  setTimeout(() => {
    window.location.href = "cv.html";
  }, 600);
}

      else if (command === "skills") {
  terminal.innerHTML += "Skills:<br>- Linux<br>- Networking basics<br>- Cybersecurity fundamentals<br>";
}

else if (command === "about") {
  terminal.innerHTML += "I am Ishaaq, an aspiring cybersecurity specialist focused on penetration testing.<br>";
}

else if (command === "contact") {
  terminal.innerHTML += "Telegram: @YourUsername<br>";
}

else if (command === "github") {
  terminal.innerHTML += "Opening GitHub...<br>";
  setTimeout(() => {
    window.open("https://github.com/F1r3-x", "_blank");
  }, 600);
}

else if (command === "cv") {
  terminal.innerHTML += "opening CV...<br>";
  setTimeout(() => {
    window.location.href = "cv.html";
  }, 600);
}

else if (command === "sudo apt install ishaaq.cv") {
  terminal.innerHTML += "Installing Ishaaq CV package...<br>";
  setTimeout(() => {
    window.location.href = "cv.html";
  }, 1200);
}

else {
  terminal.innerHTML += "unknown command — type 'help'<br>";
}

      input.value = "";
    }
  });

};
</script>

</body>
</html>
